<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel Konserta</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#f4f2ed;--card:#fff;--ink:#141414;--muted:#69645a;--line:#e4dfd4;--soft:#f0ede6;--amber:#ffb21e;--graf:#141414;--ok:#1d7a45;--warn:#9a6a00;--bad:#bf3624;
  --display:"Sora",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1b1b19;--ink:#efece6;--muted:#a39d91;--line:#2f2e2a;--soft:#232320;--ok:#53c084;--warn:#e6b23c;--bad:#f06a52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.top{background:var(--graf);color:#fff;padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em}
.top .tag{background:var(--amber);color:var(--graf);font-weight:800;font-size:11px;letter-spacing:.08em;border-radius:6px;padding:3px 8px}
.top a,.top button{margin-left:auto;color:#fff;border:1px solid #3a3a36;background:transparent;border-radius:10px;padding:8px 12px;font:600 14px var(--body);text-decoration:none;cursor:pointer}
.top a+button{margin-left:0}
main{max-width:1200px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat small{display:block;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bar input{flex:1 1 240px;min-width:0}
.list{display:flex;flex-direction:column;gap:12px}
.emp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.emp-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.emp-h .n{flex:1 1 260px;min-width:0}
.emp-h .n b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;display:block}
.emp-h .n span{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.pill{display:inline-flex;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.p-teste{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--warn)}
.p-fim{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.p-plano{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.nums{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.nums b{color:var(--ink);font-family:var(--mono);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.acts .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.btn{font:700 13.5px var(--body);border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--graf);color:var(--amber);border-color:var(--graf)}
.btn.dark{background:var(--graf);color:#fff;border-color:var(--graf)}
select.btn{padding:7px 10px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.empty,.msg{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--graf);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:9}
.mono{font-family:var(--mono)}
.abas{display:flex;gap:8px}
.abas button{font:800 14px var(--body);border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:9px 16px;cursor:pointer;display:flex;gap:8px;align-items:center}
.abas button[aria-selected="true"]{background:var(--amber);border-color:var(--amber);color:var(--graf)}
.nbadge{background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px}
.at{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px;align-items:start}
@media (max-width:820px){.at{grid-template-columns:1fr}.at.aberto .at-lista{display:none}.at:not(.aberto) .at-conv{display:none}}
.at-lista{display:flex;flex-direction:column;gap:8px}
.ch{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.ch.sel{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 30%,transparent)}
.ch-t{display:flex;gap:8px;align-items:center}.ch-t b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-aberto{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.st-respondido{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st-fechado{background:var(--soft);color:var(--muted)}
.at-conv{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:420px;max-height:calc(100vh - 160px)}
.cv-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cv-h b{font-family:var(--display);font-size:18px}
.cv-h .meta{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.cv-m{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bl{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
.bl small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
.bl.eu{align-self:flex-end;background:var(--graf);color:#fff}.bl.eu small{color:#b9b3a7}
.cv-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.cv-f textarea{flex:1;font:inherit;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 12px;resize:vertical;min-height:46px}

</style>
</head>
<body>
<header class="top">
  <img src="/icon.svg" width="32" height="32" alt="">
  <b>Painel Konserta</b><span class="tag">SÓ VOCÊ</span>
  <a href="/app">Abrir o app</a><button type="button" id="sair">Sair</button>
</header>
<main>
  <div class="msg" id="msg">Carregando…</div>
  <div class="abas" id="abas" hidden><button type="button" data-aba="empresas" aria-selected="true">Empresas</button><button type="button" data-aba="atend" aria-selected="false">Atendimento <span class="nbadge" id="atN" hidden>0</span></button></div>
  <section id="atend" hidden><div class="at" id="at"><div class="at-lista" id="atLista"></div><div class="at-conv" id="atConv"><div class="empty" style="margin:auto;border:0">Escolha uma conversa.</div></div></div></section>
  <section id="painel" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Buscar empresa, dono, e-mail…" aria-label="Buscar">
      <select id="filtro" aria-label="Filtrar">
        <option value="">Todas</option><option value="teste">Em teste</option><option value="fim">Teste acabado</option><option value="plano">Assinantes</option>
      </select>
      <button class="btn" type="button" id="recarregar">Atualizar</button>
    </div>
    <div class="list" id="lista"></div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=86400000;
// Módulos que podem ser ligados por empresa. Para criar um novo, adicione aqui e no app.
const MODULOS=[{k:"financas",t:"Finanças"}];
const PLANOS=["Bancada","Completo","Equipe"];
const RAMOS={assistencia:"Assistência técnica",mecanica:"Mecânica",marcenaria:"Marcenaria",ar:"Ar-condicionado"};
let lista=[];
const fmt=t=>t?new Date(t).toLocaleDateString("pt-BR"):"—";
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
function situacao(e){if(e.plano)return "plano";return Date.parse(e.trial_ate)>Date.now()?"teste":"fim"}

function render(){
  const tot=lista.length,teste=lista.filter(e=>situacao(e)==="teste").length,plano=lista.filter(e=>e.plano).length;
  const os=lista.reduce((a,e)=>a+Number(e.os||0),0);
  const ativas=lista.filter(e=>e.ultima_atividade&&Date.now()-Date.parse(e.ultima_atividade)<7*D).length;
  $("#stats").innerHTML=[["Empresas",tot],["Em teste",teste],["Assinantes",plano],["Ativas (7 dias)",ativas],["OS no total",os]]
    .map(([l,v])=>`<div class="stat"><small>${l}</small><b>${v}</b></div>`).join("");
  const q=$("#q").value.trim().toLowerCase(),f=$("#filtro").value;
  const vis=lista.filter(e=>(!f||situacao(e)===f)&&(!q||[e.nome,e.dono_nome,e.dono_email,e.telefone].join(" ").toLowerCase().includes(q)));
  $("#lista").innerHTML=vis.length?vis.map(e=>{
    const s=situacao(e),dias=Math.ceil((Date.parse(e.trial_ate)-Date.now())/D);
    const pill=s==="plano"?`<span class="pill p-plano">Plano ${esc(e.plano)}</span>`:s==="teste"?`<span class="pill p-teste">Teste: ${dias} ${dias===1?"dia":"dias"}</span>`:`<span class="pill p-fim">Teste acabou ${fmt(e.trial_ate)}</span>`;
    const tel=String(e.telefone||"").replace(/\D/g,"");
    const rec=e.recursos||{};
    return `<article class="emp" data-id="${e.id}">
      <div class="emp-h"><div class="n"><b>${esc(e.nome||"Sem nome")}</b><span>${esc(e.dono_nome||"")} · ${esc(e.dono_email||"")}${e.telefone?" · "+esc(e.telefone):""}</span></div>${pill}</div>
      <div class="nums"><span>${esc(RAMOS[e.segmento]||e.segmento||"—")} · ${e.tem_sistema?"tem sistema de OS":"OS completa"}</span><span>Criada <b>${fmt(e.criado_em)}</b></span><span>Técnicos <b>${e.membros}</b>${e.pendentes?` (+${e.pendentes} aguardando)`:""}</span><span>OS <b>${e.os}</b></span><span>Estoque <b>${e.estoque}</b></span><span>Cotações <b>${e.cotacoes}</b></span><span>Última atividade <b>${fmt(e.ultima_atividade)}</b></span><span>Código <b class="mono">${esc(e.codigo)}</b></span></div>
      <div class="acts">
        <span class="lbl">Teste</span><button class="btn" data-dias="7">+7 dias</button><button class="btn" data-dias="30">+30 dias</button>
        <span class="sep"></span><span class="lbl">Plano</span>
        <select class="btn" data-plano aria-label="Plano">${["",...PLANOS].map(p=>`<option value="${p}" ${(e.plano||"")===p?"selected":""}>${p||"Sem plano"}</option>`).join("")}</select>
        <span class="sep"></span><span class="lbl">Módulos</span>
        ${MODULOS.map(m=>`<button class="btn ${rec[m.k]?"on":""}" data-mod="${m.k}" aria-pressed="${!!rec[m.k]}">${m.t} ${rec[m.k]?"ligado":"desligado"}</button>`).join("")}
        ${tel.length>=10?`<span class="sep"></span><a class="btn dark" href="https://wa.me/${tel.length<=11?"55"+tel:tel}" target="_blank" rel="noopener">WhatsApp</a>`:""}
      </div></article>`}).join(""):`<div class="empty">Nenhuma empresa encontrada.</div>`;
}
async function carregar(){
  const {data,error}=await sb.rpc("admin_empresas");
  if(error){$("#msg").hidden=false;$("#painel").hidden=true;$("#msg").textContent="Não deu para carregar: "+error.message;return}
  lista=data||[];render();
}
async function atualizar(id,args,ok){
  const {error}=await sb.rpc("admin_atualizar_empresa",{e:id,...args});
  if(error){toast("Não salvou: "+error.message);return}
  toast(ok);await carregar();
}
/* ---- Atendimento ---- */
let chamados=[],atSel=null,atMsgs=[];
const ST={aberto:"Esperando você",respondido:"Respondido",fechado:"Encerrado"};
const quando=t=>new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function abaAt(a){document.querySelectorAll("#abas button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.aba===a)));
  $("#painel").hidden=a!=="empresas";$("#painel").style.display=a==="empresas"?"flex":"none";$("#atend").hidden=a!=="atend";if(a==="atend")atRender();history.replaceState(null,"",a==="atend"?"#atendimento":"#")}
async function atCarregar(silencioso){
  const {data,error}=await sb.rpc("admin_atendimentos");if(error){if(!silencioso)toast("Atendimento: "+error.message);return}
  chamados=data||[];const n=chamados.filter(c=>c.status==="aberto").length;$("#atN").textContent=n;$("#atN").hidden=!n;
  document.title=(n?"("+n+") ":"")+"Painel Konserta";
  if(atSel&&chamados.find(c=>c.id===atSel)?.nao_lidas_konserta)await atAbrir(atSel,true);else if(!$("#atend").hidden)atRender();
}
function contatoLinks(c){const v=String(c||"").trim();if(!v)return "";const d=v.replace(/\D/g,"");
  if(/@/.test(v))return `<a class="btn" href="mailto:${esc(v)}">E-mail</a>`;
  if(d.length>=10)return `<a class="btn dark" href="https://wa.me/${d.length<=11?"55"+d:d}" target="_blank" rel="noopener">WhatsApp</a>`;return ""}
function atRender(){
  $("#atLista").innerHTML=chamados.length?chamados.map(c=>`<button type="button" class="ch ${c.id===atSel?"sel":""}" data-ch="${c.id}"><span class="ch-t"><b>${esc(c.nome)}</b><span class="pill st-${c.status}">${ST[c.status]}</span>${c.nao_lidas_konserta?`<span class="nbadge">${c.nao_lidas_konserta}</span>`:""}</span>
    <small>${c.origem==="app"?"App · "+esc(c.empresa||"sem empresa"):"Site"} · ${quando(c.atualizado_em)}</small><small>${esc(c.ultima||"")}</small></button>`).join(""):`<div class="empty">Nenhuma conversa ainda. Quando alguém tocar em "Falar com uma pessoa" no Kon, aparece aqui.</div>`;
  const c=chamados.find(x=>x.id===atSel);$("#at").classList.toggle("aberto",!!c);
  if(!c){$("#atConv").innerHTML=`<div class="empty" style="margin:auto;border:0">Escolha uma conversa.</div>`;return}
  $("#atConv").innerHTML=`<div class="cv-h"><div class="bar"><button type="button" class="btn" data-atvoltar>← Voltar</button><b style="flex:1">${esc(c.nome)}</b><span class="pill st-${c.status}">${ST[c.status]}</span></div>
    <span class="meta">${c.origem==="app"?`App · ${esc(c.empresa||"")} · ${esc(c.email||"")}`:"Site"}${c.contato?" · contato: "+esc(c.contato):""}</span>
    <div class="bar">${contatoLinks(c.contato||c.email)}${c.status!=="fechado"?`<button type="button" class="btn" data-atst="fechado">Encerrar</button>`:`<button type="button" class="btn" data-atst="aberto">Reabrir</button>`}</div></div>
    <div class="cv-m" id="cvM">${atMsgs.map(m=>`<div class="bl ${m.de==="konserta"?"eu":""}"><small>${m.de==="konserta"?"Você (equipe Konserta)":esc(c.nome)} · ${quando(m.em)}</small>${esc(m.texto)}</div>`).join("")}</div>
    <form class="cv-f" id="cvF"><textarea id="cvT" placeholder="Responder… (aparece no Kon da pessoa)" maxlength="2000"></textarea><button class="btn dark" type="submit">Enviar</button></form>`;
  const m=$("#cvM");if(m)m.scrollTop=m.scrollHeight;
}
async function atAbrir(id,manterTexto){const t=manterTexto&&$("#cvT")?$("#cvT").value:"";atSel=id;const {data,error}=await sb.rpc("admin_atendimento",{p_id:id});if(error){toast(error.message);return}atMsgs=data||[];
  const c=chamados.find(x=>x.id===id);if(c)c.nao_lidas_konserta=0;atRender();if(t&&$("#cvT"))$("#cvT").value=t}
document.addEventListener("submit",async e=>{if(e.target.id!=="cvF")return;e.preventDefault();const v=$("#cvT").value.trim();if(!v||!atSel)return;
  const b=e.target.querySelector("button");b.disabled=true;const {error}=await sb.rpc("admin_responder",{p_id:atSel,p_texto:v});b.disabled=false;
  if(error){toast("Não enviou: "+error.message);return}toast("Resposta enviada");await atCarregar(true);await atAbrir(atSel)});
document.addEventListener("keydown",e=>{if(e.target.id==="cvT"&&e.key==="Enter"&&(e.ctrlKey||e.metaKey))$("#cvF").requestSubmit()});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.aba){abaAt(b.dataset.aba);return}
  if(b.dataset.ch){atAbrir(b.dataset.ch);return}
  if(b.hasAttribute("data-atvoltar")){atSel=null;atRender();return}
  if(b.dataset.atst){sb.rpc("admin_atendimento_status",{p_id:atSel,p_status:b.dataset.atst}).then(async({error})=>{if(error){toast(error.message);return}toast(b.dataset.atst==="fechado"?"Conversa encerrada":"Conversa reaberta");await atCarregar(true);atRender()});return}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const card=b.closest(".emp");const id=card&&card.dataset.id;const emp=lista.find(x=>x.id===id);
  if(b.id==="recarregar"){carregar();return}
  if(b.id==="sair"){sb.auth.signOut().then(()=>location.replace("/entrar"));return}
  if(!emp)return;
  if(b.dataset.dias){const base=Math.max(Date.now(),Date.parse(emp.trial_ate));atualizar(id,{novo_trial:new Date(base+Number(b.dataset.dias)*D).toISOString()},"Teste estendido em "+b.dataset.dias+" dias");return}
  if(b.dataset.mod){const r={...(emp.recursos||{})};r[b.dataset.mod]=!r[b.dataset.mod];if(!r[b.dataset.mod])delete r[b.dataset.mod];atualizar(id,{novos_recursos:r},"Módulo "+(r[b.dataset.mod]?"ligado":"desligado"));return}
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-plano]")){const id=e.target.closest(".emp").dataset.id;const v=e.target.value;atualizar(id,v?{novo_plano:v}:{limpar_plano:true},v?"Plano "+v+" ativado":"Plano removido")}
  if(e.target.id==="filtro")render();
});
$("#q").addEventListener("input",render);
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.replace("/entrar");return}
  const {data:ok}=await sb.rpc("sou_admin_konserta");
  if(!ok){$("#msg").textContent="Esta página é restrita.";return}
  $("#msg").hidden=true;$("#painel").hidden=false;$("#painel").style.display="flex";$("#abas").hidden=false;
  await carregar();await atCarregar();if(location.hash==="#atendimento")abaAt("atend");
  setInterval(()=>{if(document.visibilityState==="visible")atCarregar(true)},30000);
})();
</script>
</body>
</html>
