<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Konserta">
<title>Konserta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
img{max-width:100%}
[hidden]{display:none!important}
.trial{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding:10px 14px;border-radius:12px;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);font-size:14px}
.trial b{font-weight:700}.trial .btn{padding:7px 12px;font-size:13px;margin-left:auto}
.trial.fim{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.codebox{font-family:var(--f-mono);font-size:26px;letter-spacing:.25em;font-weight:600;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;text-align:center}
/* Layout: barra do app clara com a cor da empresa como destaque; colunas de status no computador; no celular, abas de status no topo e barra de navegação embaixo com botão + central. */
:root{
--brand:#2c6a5d; --brand-ink:#ffffff;
--bg:color-mix(in srgb,var(--brand) 5%,#f2f3f2); --surface:#ffffff; --surface2:color-mix(in srgb,var(--brand) 5%,#f0f1f0);
--ink:#151a18; --muted:#5b6561; --line:color-mix(in srgb,var(--brand) 10%,#dde1df);
--brand-fg:color-mix(in srgb,var(--brand) 82%,#000); --brand-soft:color-mix(in srgb,var(--brand) 12%,#ffffff);
--ok:#23824c; --warn:#a87200; --bad:#c23a28;
--t-part:#6b7a75; --t-fab:#2f66cf; --t-ped:#cf6a12; --t-seg:#8248c0; --t-emp:#0b8383;
--shadow:0 1px 2px rgba(15,25,22,.06),0 4px 14px rgba(15,25,22,.06);
--shadow-lg:0 10px 40px rgba(10,20,18,.22);
--mat:var(--brand); --mat-ink:var(--brand-ink); --accent:var(--brand); --accent-ink:var(--brand-ink);
--r:12px;
--f-display:"Barlow Semi Condensed","Arial Narrow",sans-serif;
--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:color-mix(in srgb,var(--brand) 7%,#0d100f); --surface:#161b19; --surface2:color-mix(in srgb,var(--brand) 6%,#1c2220);
--ink:#e5eae8; --muted:#94a09b; --line:color-mix(in srgb,var(--brand) 14%,#283030);
--brand-fg:color-mix(in srgb,var(--brand) 55%,#ffffff); --brand-soft:color-mix(in srgb,var(--brand) 24%,#161b19);
--ok:#4cbb7c; --warn:#e2aa30; --bad:#ef6b55;
--t-part:#93a29d; --t-fab:#6f9dff; --t-ped:#f08a3a; --t-seg:#b383ec; --t-emp:#3cc4c4;
--shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 10px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
--bg:color-mix(in srgb,var(--brand) 7%,#0d100f); --surface:#161b19; --surface2:color-mix(in srgb,var(--brand) 6%,#1c2220);
--ink:#e5eae8; --muted:#94a09b; --line:color-mix(in srgb,var(--brand) 14%,#283030);
--brand-fg:color-mix(in srgb,var(--brand) 55%,#ffffff); --brand-soft:color-mix(in srgb,var(--brand) 24%,#161b19);
--ok:#4cbb7c; --warn:#e2aa30; --bad:#ef6b55;
--t-part:#93a29d; --t-fab:#6f9dff; --t-ped:#f08a3a; --t-seg:#b383ec; --t-emp:#3cc4c4;
--shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 10px 40px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* barra do app */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
.row1{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;flex:1 1 auto;min-width:0}
.mark{width:42px;height:42px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:0 0 auto}
.logo{width:42px;height:42px;border-radius:11px;object-fit:contain;background:#fff;padding:3px;flex:0 0 auto;border:1px solid var(--line)}
.logo-lg{width:76px;height:76px;border-radius:16px;object-fit:contain;background:#fff;padding:6px;border:1px solid var(--line)}
h1{margin:0;line-height:1.05;min-width:0;display:flex;flex-direction:column}
h1 #brandName{font-family:var(--f-display);font-weight:700;font-size:21px;color:var(--ink);letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 #brandTitle{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--brand-fg);letter-spacing:.06em;text-transform:uppercase;margin-top:3px;white-space:nowrap}
.navtop{display:flex;gap:6px;align-items:center}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:filter .12s}
.btn:hover{filter:brightness(.96)}
.btn-accent{background:var(--brand);color:var(--brand-ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface2)}
.btn-line{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 55%,transparent)}
.btn-ok{background:var(--ok);color:#fff}
.badge-n{background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;text-align:center;font-size:11.5px;line-height:18px;font-family:var(--f-mono);font-weight:500}
.row2{display:flex;gap:8px;margin-top:12px;align-items:center}
.searchbox{flex:1;position:relative;min-width:0}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px 9px 36px}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-fg);border-color:color-mix(in srgb,var(--brand) 40%,transparent);font-weight:600}
.tabs{display:none}
.scope{flex:0 1 auto;max-width:46%;background:var(--brand-soft);color:var(--brand-fg);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:10px;padding:9px 10px;font-weight:600;font-size:14px;min-width:0}
.p-dono{color:var(--ink);background:var(--surface2);border:1px solid var(--line);font-weight:500}
.notice{margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--warn);color:var(--ink);font-size:13px}
/* quadro */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.col{flex:0 0 290px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col.drop{outline:2px dashed var(--brand);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.col-h h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;flex:1;letter-spacing:.005em}
.col-h .n{font-family:var(--f-mono);color:var(--muted);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.col-b{display:flex;flex-direction:column;gap:8px;padding:0 10px 12px;overflow-y:auto;min-height:40px}
.empty-col{color:var(--muted);font-size:13px;padding:8px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 12px 11px 16px;text-align:left;width:100%;position:relative;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .12s,border-color .12s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc,var(--t-part))}
.card:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.card:active{transform:scale(.99)}
.c-top{display:flex;gap:8px;align-items:flex-start}
.c-os{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface2);border-radius:6px;padding:1px 6px;flex:0 0 auto}
.c-name{font-weight:600;font-size:15px;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.c-dev{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.c-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pill{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;line-height:1.35;white-space:nowrap}
.p-tipo{color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent)}
.p-days{font-family:var(--f-mono);font-weight:500}
.d-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.d-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.d-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.p-info{color:var(--muted);background:var(--surface2);font-weight:500}
.p-buy{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.p-arr{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.p-twin{color:var(--brand-fg);background:var(--brand-soft)}
.p-urg{color:#fff;background:var(--bad)}
.p-alta{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.p-baixa{color:var(--muted);background:var(--surface2);font-weight:500}
/* painel lateral / tela cheia */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,14,12,.45);display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(580px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--ink);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);
padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h::before{content:"";width:5px;align-self:stretch;border-radius:3px;background:var(--brand)}
.sheet-h h3{font-family:var(--f-display);font-size:21px;font-weight:700;margin:0;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.sheet-b{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.sec>h4{margin:0;font-family:var(--f-display);font-size:16px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.005em}
.sec .u-row,.sec .part,.sec .shop-i,.sec .wa{background:var(--surface2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea,.inp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
textarea{resize:vertical;min-height:72px}
.full{grid-column:1/-1}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.st-btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
.st-btn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 11px}
.part .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.ps{border:0;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.ps-comprar{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.ps-encomendada{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.ps-chegou{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.ps-aplicada{color:var(--muted);background:var(--surface)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:3px 7px;border-radius:7px}
.x:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.addrow{display:flex;gap:8px}
.addrow .inp{flex:1}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.m-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);max-width:100%}
.m-item img,.m-item video{width:100%;height:100%;object-fit:cover;display:block}
.m-item .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff}
.m-item .vtag{position:absolute;left:5px;bottom:5px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 5px;font-weight:600}
.m-add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;aspect-ratio:1;border:1.5px dashed color-mix(in srgb,var(--brand) 40%,var(--line));border-radius:10px;color:var(--brand-fg);font-size:13px;font-weight:500;text-align:center;background:var(--brand-soft);cursor:pointer}
.m-add b{font-size:26px;font-weight:400}
.hint{font-size:12.5px;color:var(--muted)}
.twin-box{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.twin-box a{color:var(--brand-fg);font-weight:600}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.timeline li{display:flex;gap:10px}
.timeline .when{font-family:var(--f-mono);color:var(--muted);flex:0 0 auto;font-size:12px;padding-top:1px}
.wa{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px}
.wa pre{white-space:pre-wrap;margin:0;font-family:var(--f-body);font-size:13.5px;user-select:all}
.wa .acts{display:flex;gap:8px;flex-wrap:wrap}
.wa a{color:var(--ok);font-weight:600;font-size:14px;align-self:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.saved{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;white-space:nowrap}
.finish{display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--ok) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:12px;padding:11px 12px}
.shop-g{display:flex;flex-direction:column;gap:6px}
.shop-i{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.shop-i .txt{flex:1;min-width:0}
.shop-i .txt b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.shop-i .txt button{border:0;background:none;padding:0;color:var(--muted);font-size:12.5px;text-align:left}
.shop-i .txt button:hover{text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);text-align:center}
/* entrada */
.login{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--brand) 85%,#fff) 0%,var(--brand) 45%,color-mix(in srgb,var(--brand) 70%,#000) 100%);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;overflow-y:auto;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.login-card{background:var(--surface);color:var(--ink);border-radius:20px;padding:24px 20px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg);margin:auto}
.login-card h2{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;line-height:1.05}
.login-card h2 small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-fg);margin-top:5px;font-weight:600}
.login-card form{display:flex;flex-direction:column;gap:12px}
.login-card .btn-accent{padding:12px 14px;font-size:15px}
.pin{font-family:var(--f-mono);letter-spacing:.45em;font-size:22px;text-align:center}
.err{color:var(--bad);font-size:13px;min-height:1em}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who button{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.who button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.u-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.u-row .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.u-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.logo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg-list{display:flex;flex-direction:column;gap:6px}
.seg-opt{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:500;text-align:left;width:100%}
.seg-opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
button.seg-opt:hover{border-color:var(--brand)}
.seg-extra{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.qtybox{display:flex;align-items:center;gap:4px}
.qtybox button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:17px;line-height:1}

a.btn{text-decoration:none}

.orc-tot b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;color:var(--brand-fg)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.os-st{display:inline-flex;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px}
.os-rascunho{color:var(--muted);background:var(--surface2)}
.os-enviado{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.os-aprovado{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.os-recusado{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.odoc{background:#fff;color:#151a18;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}

.odoc-logo{width:58px;height:58px;border-radius:12px;background:#fff;object-fit:contain;padding:4px;flex:0 0 auto}

.odoc-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.odoc-info{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.odoc-info>div{display:flex;flex-direction:column;gap:1px;min-width:0;overflow-wrap:anywhere}
.odoc small{color:#6b7570;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.odoc-info span{font-size:13px;color:#4a5450}
.odoc-def{font-size:13.5px}
.odoc-tab{width:100%;border-collapse:collapse;font-size:14px}
.odoc-tab th{text-align:left;font-size:11px;color:#6b7570;text-transform:uppercase;letter-spacing:.05em;background:#f1f3f2;padding:8px}
.odoc-tab th:not(:first-child),.odoc-tab td:not(:first-child){text-align:right;white-space:nowrap}
.odoc-tab td{padding:9px 8px;border-bottom:1px solid #e6eae8;vertical-align:top}
.odoc-tab td small{display:block;text-transform:none;letter-spacing:0;font-weight:400}
.odoc-tot{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px;color:#4a5450}
.odoc-tot .big{background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600}
.odoc-tot .big b{font-size:22px;margin-left:8px}
.odoc-foot{font-size:13px;color:#4a5450}
/* fazer agora */
.nowbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px}
.nowbtn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);background:var(--brand-soft);color:var(--ink);border-radius:14px;padding:12px 14px}
.nowbtn .ic{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:19px}
.nowbtn b{display:block;font-size:15px}.nowbtn span.s{font-size:12.5px;color:var(--muted)}
.nowbtn .go{margin-left:auto;color:var(--brand-fg);font-weight:600;font-size:13.5px;white-space:nowrap}
.rec{display:flex;flex-direction:column;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rec-top{display:flex;gap:10px;align-items:flex-start}
.rec-n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rec-t{flex:1;min-width:0;overflow-wrap:anywhere}.rec-t b{font-size:14.5px}.rec-t small{display:block;color:var(--muted);font-size:12.5px}
.why{display:flex;flex-wrap:wrap;gap:5px}
.tmp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tmp button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600}
.tmp button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.p-rap{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.p-med{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.p-dem{color:var(--muted);background:var(--surface2)}

.bnav{display:none}

.board{display:block;padding-top:14px}

.col-h{display:none}

.card{padding:13px 14px 13px 18px}

.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}

padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}

/* ===== Konserta — identidade visual (sobrepõe o tema base) ===== */
:root{
--graf:#141414;--graf2:#1f1f1d;--paper:#f4f2ed;
--bg:var(--paper);--surface:#ffffff;--surface2:#f0ede6;
--ink:#141414;--muted:#69645a;--line:#e4dfd4;
--brand-fg:color-mix(in srgb,var(--brand) 62%,#1a1206);
--brand-soft:color-mix(in srgb,var(--brand) 14%,#ffffff);
--ok:#1d7a45;--warn:#9a6a00;--bad:#bf3624;
--shadow:0 1px 0 rgba(20,20,20,.04),0 6px 18px -8px rgba(20,20,20,.16);
--shadow-lg:0 24px 60px -12px rgba(20,20,20,.35);
--r:16px;
--f-display:"Sora","Arial",sans-serif;
--f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
--f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#121211;--surface:#1b1b19;--surface2:#232320;--ink:#efece6;--muted:#a39d91;--line:#2f2e2a;
--brand-fg:color-mix(in srgb,var(--brand) 70%,#ffffff);--brand-soft:color-mix(in srgb,var(--brand) 20%,#1b1b19);
--ok:#53c084;--warn:#e6b23c;--bad:#f06a52;--graf2:#0c0c0b;
--shadow:0 1px 0 rgba(0,0,0,.3);--shadow-lg:0 24px 60px -12px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{
--bg:#121211;--surface:#1b1b19;--surface2:#232320;--ink:#efece6;--muted:#a39d91;--line:#2f2e2a;
--brand-fg:color-mix(in srgb,var(--brand) 70%,#ffffff);--brand-soft:color-mix(in srgb,var(--brand) 20%,#1b1b19);
--ok:#53c084;--warn:#e6b23c;--bad:#f06a52;--graf2:#0c0c0b;
--shadow:0 1px 0 rgba(0,0,0,.3);--shadow-lg:0 24px 60px -12px rgba(0,0,0,.7)}
body{font-size:15px;letter-spacing:-.003em}
/* topo */
header.top{border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(20,20,20,.02)}
.mark{border-radius:13px;font-family:var(--f-display);font-weight:800;letter-spacing:-.04em;background:var(--graf);color:var(--brand)}
.logo{border-radius:13px}
h1 #brandName{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.025em}
h1 #brandTitle{font-family:var(--f-body);font-weight:800;font-size:10.5px;letter-spacing:.09em;color:var(--brand-fg);margin-top:4px}
.btn{border-radius:12px;font-weight:700;letter-spacing:-.005em}
.btn-accent{box-shadow:0 6px 16px -8px color-mix(in srgb,var(--brand) 80%,transparent)}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.search{border-radius:12px;background:var(--surface2);border-color:transparent;padding-block:11px}
.search:focus{background:var(--surface);border-color:var(--brand);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.chip{border-radius:99px;font-weight:600;background:transparent}
.chip[aria-pressed="true"]{background:var(--graf);color:#fff;border-color:var(--graf)}
.scope{border-radius:12px;background:var(--graf);color:#fff;border-color:var(--graf)}
/* Liberar a loja */
.nowbtn{background:var(--graf);color:#fff;border:0;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.nowbtn .ic{background:var(--brand);color:var(--brand-ink);border-radius:12px}
.nowbtn b{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em}
.nowbtn span.s{color:#bdb7ab}
.nowbtn .go{color:var(--brand)}
/* quadro (computador) */
.col{background:transparent;border:0;border-radius:0}
.col-h{padding:6px 4px 12px}
.col-h h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.015em}
.col-h .n{background:var(--graf);color:#fff;border:0;font-weight:500}
.col-b{padding:0 2px 12px;gap:10px}
/* cartões */
.card{border-radius:var(--r);border-color:var(--line);padding:13px 14px 13px 18px;gap:7px}
.card::before{width:5px;border-radius:0}
.card:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line));box-shadow:0 10px 24px -14px rgba(20,20,20,.35)}
.c-name{font-weight:800;font-size:15.5px;letter-spacing:-.015em}
.c-os{background:var(--surface2);color:var(--muted);border-radius:7px;padding:2px 7px;font-size:11px}
.c-dev{color:var(--muted);font-size:13.5px}
.pill{border-radius:7px;font-weight:700;font-size:11.5px;padding:3px 8px}
.p-urg{background:var(--bad)}
.empty-col{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:18px 14px;text-align:center}
/* painéis */
.overlay{background:rgba(12,12,11,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{background:var(--bg)}
.sheet-h{border-bottom:1px solid var(--line)}
.sheet-h::before{display:none}
.sheet-h h3{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.025em}
.sec{border-radius:18px;border-color:var(--line);padding:16px;box-shadow:var(--shadow)}
.sec>h4{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.015em}
.fld label{font-weight:700;font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{border-radius:12px;background:var(--surface2);border-color:transparent;padding:11px 12px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{background:var(--surface)}
.st-btn{border-radius:99px;font-weight:600;background:var(--surface2);border-color:transparent}
.st-btn[aria-pressed="true"]{background:var(--graf);color:#fff;border-color:var(--graf)}
.tmp button[aria-pressed="true"]{background:var(--graf);color:#fff;border-color:var(--graf)}
.sn{background:var(--graf);color:var(--brand)}
.orc-tot b{color:var(--ink);font-family:var(--f-display);font-weight:800}
.orc-form{background:var(--surface2)}
.u-row,.part,.shop-i,.orc-i,.rec{border-radius:14px}
.toast{background:var(--graf);color:#fff;border-radius:14px;font-weight:600}
.trial{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:9px 14px}
.trial b{color:var(--brand-fg)}
.trial::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.trial.fim{background:var(--bad);color:#fff}.trial.fim b{color:#fff}
.odoc-h{background:var(--graf);color:#fff}
.odoc-mark{background:var(--brand);color:var(--graf)}
.odoc-tot .big{background:var(--brand);color:var(--brand-ink)}
/* entrada / estados */
.login{background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb,var(--brand) 45%,transparent),transparent 70%),var(--graf);color:#fff}
.login-card{border-radius:24px}
.login-card h2{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em}
.login-card .mark{background:var(--graf);color:var(--brand)}
@media (max-width:760px){
.tab{background:var(--surface2);border-color:transparent;font-weight:700}
.tab[aria-selected="true"]{background:var(--graf);color:#fff;border-color:var(--graf)}
.tab[aria-selected="true"] .tn{color:var(--brand);opacity:1}
.bnav{background:color-mix(in srgb,var(--surface) 92%,transparent);border-top-color:var(--line)}
.bn{font-weight:700}
.bn[aria-current="true"]{color:var(--ink)}
.bn[aria-current="true"] svg.i{stroke:var(--ink);stroke-width:2.3}
.fab{border-radius:18px;background:var(--brand);color:var(--brand-ink);box-shadow:0 10px 22px -6px color-mix(in srgb,var(--brand) 70%,transparent),0 0 0 5px var(--bg)}
.card{padding:14px 15px 14px 19px}
}
</style>
</head>

<script>
/* Konserta: ponte entre o app e o Supabase (dados, arquivos e downloads) */
(function(){
const SB=window.sb;
window.KS={eid:null,uid:null,email:"",estado:"carregando",assinatura:null,empresaNome:""};
const snapOf=rows=>({docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.d})),size:rows.length,empty:!rows.length});
const nowIso=()=>new Date().toISOString();
const rnd=()=>Math.random().toString(36).slice(2,8);
function docsCol(eid,col){
const map=new Map();
return {
doc(id){return {
id,
async set(d){const {error}=await SB.from("docs").upsert({empresa_id:eid,col,id,dados:d,atualizado_em:nowIso()});if(error)throw error;map.set(id,d)},
async update(d){const cur=map.get(id)||{};const {error}=await SB.from("docs").upsert({empresa_id:eid,col,id,dados:{...cur,...d},atualizado_em:nowIso()});if(error)throw error;map.set(id,{...cur,...d})},
async delete(){const {error}=await SB.from("docs").delete().match({empresa_id:eid,col,id});if(error)throw error;map.delete(id)}
}},
onSnapshot(cb,onErr){
let alive=true;
const emit=()=>{if(alive)cb(snapOf([...map].map(([id,d])=>({id,d}))))};
const load=async()=>{
let from=0;const step=1000;map.clear();
for(;;){
const {data,error}=await SB.from("docs").select("id,dados").eq("empresa_id",eid).eq("col",col).range(from,from+step-1);
if(error){onErr&&onErr(error);return}
data.forEach(r=>map.set(r.id,r.dados));
if(data.length<step)break;from+=step;
}
emit();
};
load();
const ch=SB.channel("d-"+col+"-"+rnd())
.on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"empresa_id=eq."+eid},p=>{
if(p.eventType==="DELETE"){const o=p.old||{};if(o.empresa_id&&o.empresa_id!==eid)return;if(o.col&&o.col!==col)return;if(map.delete(o.id))emit();return}
const n=p.new;if(!n||n.col!==col)return;map.set(n.id,n.dados);emit();
})
.subscribe(st=>{if(st==="SUBSCRIBED")load()});
const vis=()=>{if(document.visibilityState==="visible")load()};
document.addEventListener("visibilitychange",vis);
return ()=>{alive=false;document.removeEventListener("visibilitychange",vis);SB.removeChannel(ch)};
}
};
}
function membrosCol(eid){
let rows=[];
return {
doc(uid){return {
id:uid,
async set(d){
const cur=rows.find(r=>r.id===uid)||{};
if(uid===KS.uid&&d.nome&&d.nome!==cur.nome){const {error}=await SB.rpc("mudar_meu_nome",{e:eid,novo:d.nome});if(error)throw error}
const patch={};
if("admin" in d&&!!d.admin!==!!cur.admin)patch.admin=!!d.admin;
if(!!d.pendente!==!!cur.pendente)patch.pendente=!!d.pendente;
if(Object.keys(patch).length){const {error}=await SB.from("membros").update(patch).match({empresa_id:eid,user_id:uid});if(error)throw error}
},
async delete(){const {error}=await SB.from("membros").delete().match({empresa_id:eid,user_id:uid});if(error)throw error}
}},
onSnapshot(cb,onErr){
let alive=true;
const load=async()=>{
const {data,error}=await SB.from("membros").select("user_id,nome,admin,pendente,criado_em").eq("empresa_id",eid);
if(error){onErr&&onErr(error);return}
rows=data.map(r=>({id:r.user_id,d:{nome:r.nome,admin:r.admin,pendente:r.pendente,criadoEm:Date.parse(r.criado_em)}}));
rows.forEach(r=>Object.assign(r,r.d));
if(alive)cb(snapOf(rows));
};
load();
const ch=SB.channel("m-"+rnd()).on("postgres_changes",{event:"*",schema:"public",table:"membros",filter:"empresa_id=eq."+eid},()=>load()).subscribe();
return ()=>{alive=false;SB.removeChannel(ch)};
}
};
}
function empresaDoc(eid){
return {
async set(d){const {error}=await SB.from("empresas").update({config:d}).eq("id",eid);if(error)throw error},
onSnapshot(cb){
let alive=true;
const load=async()=>{const {data,error}=await SB.from("empresas").select("config").eq("id",eid).maybeSingle();
if(!error&&data&&alive)cb({exists:true,data:()=>data.config||{}})};
load();
const ch=SB.channel("e-"+rnd()).on("postgres_changes",{event:"UPDATE",schema:"public",table:"empresas",filter:"id=eq."+eid},p=>{if(alive&&p.new)cb({exists:true,data:()=>p.new.config||{}})}).subscribe();
return ()=>{alive=false;SB.removeChannel(ch)};
}
};
}
const db={
collection(path){const p=path.split("/");
if(p[0]==="ws"&&p.length===3)return p[2]==="usuarios"?membrosCol(p[1]):docsCol(p[1],p[2]);
return {doc(){return {set:async()=>{},update:async()=>{},delete:async()=>{}}},onSnapshot(){return ()=>{}}};
},
doc(path){const p=path.split("/");
if(p[0]==="ws"&&p.length===2)return empresaDoc(p[1]);
return {set:async()=>{},onSnapshot(){return ()=>{}}};
}
};
const assets={
async upload(file){
const nome=(file.name||"arquivo").normalize("NFD").replace(/[^\w.\-]+/g,"_").slice(-60);
const path=KS.eid+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now()+rnd())+"-"+nome;
const {error}=await SB.storage.from("arquivos").upload(path,file,{contentType:file.type||undefined,upsert:false});
if(error)throw error;
const url=SB.storage.from("arquivos").getPublicUrl(path).data.publicUrl;
return {id:path,url,sizeBytes:file.size,contentType:file.type};
},
async delete(id){if(!id||!String(id).includes("/"))return {deleted:false};const {error}=await SB.storage.from("arquivos").remove([id]);if(error)throw error;return {deleted:true}},
async list(){return {assets:[],usage:{files:0,bytes:0}}}
};
const downloads={
async save({filename,data}){
const blob=data instanceof Blob?data:new Blob([data]);
const url=URL.createObjectURL(blob);const a=document.createElement("a");
a.href=url;a.download=filename||"arquivo";document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),4000);return {status:"saved"};
}
};
const user={isOwner:async()=>!!(window.me&&window.me.admin),canEdit:async()=>true,id:async()=>KS.uid};
window.claude={use:async n=>({db,assets,downloads,user})[n]||null};
})();
</script>
<script>
const STATUS=[
{k:"fila",t:"Fila de Análise",lim:[5,10]},
{k:"aprovacao",t:"Aguardando Aprovação",lim:[5,10]},
{k:"pecas",t:"Aguardando Peças",lim:[15,30]},
{k:"bancada",t:"Em Bancada",lim:[10,20]},
{k:"pronto",t:"Pronto / Aguardando Retirada",lim:[7,30]},
{k:"devolvido",t:"Devolvido sem Reparo",lim:[7,30]},
{k:"entregue",t:"Entregue",lim:[999,999]}
];
const TIPOS=[
{k:"particular",t:"Particular",c:"--t-part"},
{k:"fabrica",t:"Garantia de Fábrica",c:"--t-fab"},
{k:"pedroso",t:"Garantia da loja",c:"--t-ped"},
{k:"seguradora",t:"Seguradora",c:"--t-seg"},
{k:"empresa",t:"Empresa",c:"--t-emp"}
];
const PRI=[{k:"urgente",t:"Urgente",r:3},{k:"alta",t:"Alta",r:2},{k:"normal",t:"Normal",r:1},{k:"baixa",t:"Baixa",r:0}];
const priOf=k=>PRI.find(p=>p.k===k)||PRI[2];
const SEG={
assistencia:{xk:"acessorios",xl:"Acessórios deixados",xp:"Ex.: cabo, controle, caixa",el:"Estado na entrada",ep:"Ex.: riscos na tampa, liga mas não aquece",moPh:"Ex.: Mão de obra, troca de placa",pcPh:"Ex.: Resistência 1500W",stockPh:"Ex.: Resistência air fryer 1500W",partPh:"capacitor 10µF 450V",t:"Assistência técnica",title:"Controle de Bancada",item:"Aparelho / modelo",ph:"Ex.: Air fryer 4L",def:"Defeito",bench:"Em Bancada",noun:"aparelho",nouns:"aparelhos",opts:[["fabrica","Atendo garantias de fábrica"],["seguradora","Atendo seguradoras"]]},
mecanica:{xk:"km",xl:"Quilometragem",xp:"Ex.: 85.400 km",el:"Estado do veículo na entrada",ep:"Ex.: risco na porta, tanque 1/4",moPh:"Ex.: Troca de óleo e filtro, alinhamento",pcPh:"Ex.: Pastilha de freio dianteira",stockPh:"Ex.: Pastilha de freio dianteira",partPh:"filtro de óleo",t:"Mecânica automotiva",title:"Controle da Oficina",item:"Veículo / placa",ph:"Ex.: Gol 2015 · ABC1D23",def:"Problema relatado",bench:"Em Serviço",noun:"veículo",nouns:"veículos",opts:[["seguradora","Atendo seguradoras"],["empresa","Atendo empresas (frotas)"]]},
marcenaria:{xk:"endereco",xl:"Endereço de entrega / instalação",xp:"Rua, número, bairro",el:"Observações do pedido",ep:"Ex.: cor branca, puxador embutido",moPh:"Ex.: Montagem e instalação",pcPh:"Ex.: Chapa MDF branco 18mm",stockPh:"Ex.: Chapa MDF branco 18mm",partPh:"dobradiça 35mm com amortecedor",t:"Marcenaria",title:"Controle da Marcenaria",item:"Móvel / projeto",ph:"Ex.: Guarda-roupa 6 portas",def:"Pedido / medidas",bench:"Em Produção",noun:"pedido",nouns:"pedidos",opts:[]},
ar:{xk:"endereco",xl:"Endereço do serviço",xp:"Rua, número, bairro",el:"Observações do local",ep:"Ex.: 2º andar, precisa de escada",moPh:"Ex.: Instalação split 12.000 BTUs",pcPh:"Ex.: Kit instalação 3 m",stockPh:"Ex.: Tubo de cobre 1/4 (metro)",partPh:"capacitor 35+5µF",t:"Ar-condicionado (instalação e reparo)",title:"Controle de Serviços",item:"Equipamento / BTUs",ph:"Ex.: Split 12.000 BTUs",def:"Serviço / defeito",bench:"Em Execução",noun:"equipamento",nouns:"equipamentos",opts:[["seguradora","Atendo seguradoras"],["fabrica","Atendo garantias de fábrica"]]}
};
const seg=()=>SEG[empresa.segmento]||SEG.assistencia;
function tiposOn(){const on=["particular","pedroso"];const at=empresa.atende||{};seg().opts.forEach(([k])=>{if(at[k])on.push(k)});return TIPOS.filter(t=>on.includes(t.k))}
let estoque=[],scol=null,cotList=[],ccol=null,curKind="os";
const isCot=o=>o&&o.kind==="cot";
function curObj(){return curKind==="cot"?cotList.find(c=>c.id===openId):osList.find(x=>x.id===openId)}
const PSTAT=[{k:"comprar",t:"Precisa comprar"},{k:"encomendada",t:"Encomendada"},{k:"chegou",t:"Chegou"},{k:"aplicada",t:"Aplicada"}];
const DAY=86400000;
let db=null,assets=null,col=null;
let osList=[];            // documentos {id,...}
let loaded=false;
let filtroTipo="todos";
let q="";
let activeTab="fila";
let openId=null;          // OS aberta no painel
let sheetMode=null;       // 'os' | 'new' | 'shop'
let delConfirm=false;
let ucol=null,users=[],usersLoaded=false,me=null,sessId=null;
let cid=null,wsList=[],wsLoaded=false,unsubs=[];
try{cid=localStorage.getItem("bancada.ws")}catch(e){}
try{sessId=localStorage.getItem("bancada.sessao")}catch(e){}
try{const t=localStorage.getItem("bancada.tab");if(t)activeTab=t;const f=localStorage.getItem("bancada.tipo");if(f)filtroTipo=f}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/\s+/g," ");
const tipoOf=k=>TIPOS.find(t=>t.k===k)||TIPOS[0];
const stOf=k=>STATUS.find(s=>s.k===k)||STATUS[0];
const daysIn=o=>Math.max(0,Math.floor((Date.now()-(o.statusDesde||o.criadoEm||Date.now()))/DAY));
const entradaOf=o=>o.entrada||o.criadoEm||Date.now();
const daysShop=o=>Math.max(0,Math.floor((Date.now()-entradaOf(o))/DAY));
const WAIT=k=>k==="pronto"||k==="devolvido";
const toISO=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fromISO=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||"");return m?new Date(+m[1],+m[2]-1,+m[3],12).getTime():null};
const fmtDia=ts=>new Date(ts).toLocaleDateString("pt-BR");
const plural=(n,a,b)=>n+" "+(n===1?a:b);
let empresa={nome:"",horario:"",logoId:"",logoUrl:""};
const logoSrc=()=>empresa.logoUrl||(empresa.logoId?"/_blob/"+empresa.logoId:"");
const fmtD=ts=>{const d=new Date(ts);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function notice(msg){const n=$("#notice");n.textContent=msg;n.hidden=!msg}
function twinsOf(o){
const n=norm(o.cliente);if(!n)return[];
return osList.filter(x=>x.id!==o.id&&norm(x.cliente)===n&&x.status!=="entregue");
}
let scope="me";try{scope=localStorage.getItem("bancada.scope")||"me"}catch(e){}
const activeUsers=()=>users.filter(u=>!u.pendente);
function ownerOf(o){if(o.dono&&users.some(u=>u.id===o.dono))return o.dono;const a=users.filter(u=>u.admin&&!u.pendente)[0]||users[0];return a?a.id:null}
function scopeId(){return scope==="me"?(me?me.id:null):scope}
function scopeMatch(o){return scope==="all"||ownerOf(o)===scopeId()}
function firstName(id){const u=users.find(x=>x.id===id);return u?u.nome.split(" ")[0]:"?"}
function renderScope(){
const sel=$("#scope");const au=activeUsers();
if(!me||au.length<2){sel.hidden=true;if(scope!=="me"){scope="me"}return}
if(scope!=="me"&&scope!=="all"&&!au.some(u=>u.id===scope))scope="me";
sel.hidden=false;
sel.innerHTML=`<option value="me">Meus aparelhos</option>${au.filter(u=>u.id!==me.id).map(u=>`<option value="${u.id}">De ${esc(u.nome.split(" ")[0])}</option>`).join("")}<option value="all">Toda a equipe</option>`;
sel.value=scope;
}
function matches(o){
if(!scopeMatch(o))return false;
if(filtroTipo!=="todos"&&(o.tipo||"particular")!==filtroTipo)return false;
if(!q)return true;
const hay=norm([o.num,o.cliente,o.aparelho,o.defeito,o.marca].join(" "));
return norm(q).split(" ").every(w=>hay.includes(w));
}
const numOf=o=>{const n=parseInt(String(o.num||"").replace(/\D/g,""),10);return isFinite(n)?n:Infinity};
const isUrg=o=>priOf(o.prioridade).k==="urgente";
function sortList(a){return a.sort((x,y)=>{const nx=numOf(x),ny=numOf(y);return (isUrg(y)-isUrg(x))||((nx===Infinity)-(ny===Infinity))||(nx===Infinity?0:ny-nx)||(entradaOf(y)-entradaOf(x))})}
/* ---------- Quadro ---------- */
function renderChips(){
const on=tiposOn();if(filtroTipo!=="todos"&&!on.some(t=>t.k===filtroTipo))filtroTipo="todos";
const opts=[{k:"todos",t:"Todos"}].concat(on);
$("#chips").innerHTML=opts.map(o=>`<button type="button" class="chip" data-tipo="${o.k}" aria-pressed="${filtroTipo===o.k}">${esc(o.t)}</button>`).join("");
}
function renderBoard(){
const vis=osList.filter(matches);
const by={};STATUS.forEach(s=>by[s.k]=[]);
vis.forEach(o=>(by[o.status]||by.fila).push(o));
$("#tabs").innerHTML=STATUS.map(s=>`<button type="button" role="tab" class="tab" data-tab="${s.k}" aria-selected="${activeTab===s.k}">${esc(s.t.split(" / ")[0])}<span class="tn">${by[s.k].length}</span></button>`).join("");
$("#board").innerHTML=STATUS.map(s=>{
const items=sortList(by[s.k]);
const body=!loaded?`<div class="empty-col">Carregando…</div>`:
items.length?items.map(cardHTML).join(""):`<div class="empty-col">${osList.some(scopeMatch)?"Nenhuma OS aqui.":scope==="me"?"Seu quadro está vazio. Toque em + para adicionar seu primeiro "+seg().noun+".":"Nenhuma OS neste quadro."}</div>`;
return `<section class="col ${activeTab===s.k?"active":""}" data-col="${s.k}"><div class="col-h"><h2>${esc(s.t)}</h2><span class="n">${items.length}</span></div><div class="col-b">${body}</div></section>`;
}).join("");
renderNowBar();if(sheetMode==="now")openNow();
const nb=shopItems().filter(i=>i.p.status==="comprar").length;
["#shopN","#shopN2"].forEach(x=>{const b=$(x);b.textContent=nb;b.hidden=!nb});
}
function cardHTML(o){
const tp=tipoOf(o.tipo);const st=stOf(o.status);const w=WAIT(o.status);const d=w?daysIn(o):daysShop(o);
const dc=d>=st.lim[1]?"d-bad":d>=st.lim[0]?"d-warn":"d-ok";
const pecas=o.pecas||[];
const buy=pecas.filter(p=>p.status==="comprar").length, enc=pecas.filter(p=>p.status==="encomendada").length, arr=pecas.filter(p=>p.status==="chegou").length;
const nm=(o.midia||[]).length;const tw=twinsOf(o).length;
const pr=priOf(o.prioridade);
let meta=pr.k==="urgente"?`<span class="pill p-urg">Urgente</span>`:pr.k==="alta"?`<span class="pill p-alta">Prioridade alta</span>`:"";
meta+=`<span class="pill p-tipo">${esc(o.tipo==="fabrica"&&o.marca?"Fábrica · "+o.marca:tp.t)}</span>`;
if(o.status!=="entregue")meta+=`<span class="pill p-days ${dc}" title="${w?"Dias aguardando retirada":"Dias desde que chegou"}">${w?(d===0?"pronto hoje":plural(d,"dia","dias")+" aguardando"):(d===0?"chegou hoje":plural(d,"dia","dias")+" na loja")}</span>`;
if(buy)meta+=`<span class="pill p-buy">${buy} a comprar</span>`;
if(enc)meta+=`<span class="pill p-info">${enc} encomendada${enc>1?"s":""}</span>`;
if(arr)meta+=`<span class="pill p-arr">${arr} chegou</span>`;
if(nm)meta+=`<span class="pill p-info">${nm} mídia${nm>1?"s":""}</span>`;
if(full()&&o.orc&&o.orc.itens&&o.orc.itens.length){const cs={rascunho:"p-info",enviado:"d-warn",aprovado:"p-arr",recusado:"p-buy"}[o.orc.status]||"p-info";meta+=`<span class="pill ${cs} mono">${fmtR(orcTotal(o))}${o.orc.status==="aprovado"?" ✓":o.orc.status==="enviado"?" · enviado":""}</span>`}
if(tw)meta+=`<span class="pill p-twin">+${tw} ${tw>1?seg().nouns:seg().noun}</span>`;
if(pr.k==="baixa")meta+=`<span class="pill p-baixa">Baixa</span>`;
const tp2=tempoOf(o.tempo);if(tp2&&!["pronto","devolvido","entregue"].includes(o.status))meta+=`<span class="pill ${tp2.c}">${tp2.t}</span>`;
if(scope==="all"&&activeUsers().length>1)meta+=`<span class="pill p-dono">${esc(firstName(ownerOf(o)))}</span>`;
return `<button type="button" class="card" draggable="true" data-id="${o.id}" style="--tc:var(${tp.c})">
<div class="c-top"><span class="c-name">${esc(o.cliente||"Sem nome")}</span><span class="c-os">${o.num?"#"+esc(o.num):""}</span></div>
${o.aparelho||o.defeito?`<div class="c-dev">${esc([o.aparelho,o.defeito].filter(Boolean).join(" · "))}</div>`:""}
<div class="c-meta">${meta}</div></button>`;
}
/* ---------- Gravação ---------- */
async function save(o,quiet){
o.atualizadoEm=Date.now();
const {id,...data}=o;
const cc=o.kind==="cot"?ccol:col;
if(!cc){if(!quiet)toast("Sem conexão: alteração só nesta tela");return}
try{await cc.doc(id).set(data);if(!quiet)toast("Salvo")}
catch(e){toast(e&&e.code==="quota_exceeded"?"Armazenamento cheio":"Não salvou. Tente de novo.")}

/* ---------- Fazer agora (liberar a loja) ---------- */
const TEMPO=[{k:"rapido",t:"Rápido",c:"p-rap",pts:45},{k:"medio",t:"Médio",c:"p-med",pts:12},{k:"demorado",t:"Demorado",c:"p-dem",pts:-25}];
const tempoOf=k=>TEMPO.find(t=>t.k===k)||null;
function tempoChips(o,dataAttr){return `<div class="tmp"><span class="hint">Tempo:</span>${TEMPO.map(t=>`<button type="button" ${dataAttr}="${o.id}|${t.k}" aria-pressed="${o.tempo===t.k}">${t.t}</button>`).join("")}</div>`}
const partsOk=o=>!(o.pecas||[]).some(p=>p.status==="comprar"||p.status==="encomendada");
function nowLists(){
const mine=osList.filter(o=>scopeMatch(o)&&o.status!=="entregue");
const sair=mine.filter(o=>WAIT(o.status)).sort((a,b)=>daysIn(b)-daysIn(a));
const resp=mine.filter(o=>o.status==="aprovacao").sort((a,b)=>daysIn(b)-daysIn(a));
const cand=mine.filter(o=>["fila","bancada","pecas"].includes(o.status)&&partsOk(o)&&!(o.orc&&o.orc.status==="recusado"));
const rap=cand.map(o=>{const why=[];let sc=0;const t=tempoOf(o.tempo);
if(t){sc+=t.pts;why.push([t.c,t.t])}else why.push(["p-info","sem tempo marcado"]);
if(o.status==="pecas"&&(o.pecas||[]).length){sc+=20;why.push(["p-arr","peça chegou"])}
else if(!(o.pecas||[]).length){sc+=8;why.push(["p-info","sem peça"])}
if(o.status==="bancada"){sc+=12;why.push(["p-info","já na bancada"])}
const d=daysShop(o);sc+=Math.min(d,60)*0.9;if(d>=5)why.push([d>=20?"d-bad":"d-warn",plural(d,"dia","dias")+" na loja"]);
if(isUrg(o)){sc+=60;why.unshift(["p-urg","Urgente"])}else if(priOf(o.prioridade).k==="alta")sc+=15;
if(o.orc&&o.orc.status==="aprovado"){sc+=10;why.push(["p-arr","aprovado"])}
return {o,sc,why}}).sort((a,b)=>b.sc-a.sc);
return {sair,resp,rap,semTempo:cand.filter(o=>!o.tempo).length,travadas:mine.filter(o=>["fila","bancada","pecas"].includes(o.status)&&!partsOk(o)).length,total:mine.length};
}
function renderNowBar(){
const bar=$("#nowbar");if(!me||!loaded){bar.hidden=true;return}

if(!L.total){bar.hidden=true;return}
bar.hidden=false;
bar.innerHTML=`<button type="button" class="nowbtn" data-act="now"><span class="ic">⚡</span><span><b>Liberar a loja</b><span class="s">${L.total} ${L.total===1?seg().noun:seg().nouns} na loja · ${L.sair.length} podem sair já · ${Math.min(L.rap.length,5)} consertos rápidos</span></span><span class="go">Ver →</span></button>`;
}

<div class="why">${why.map(([c,t])=>`<span class="pill ${c}">${esc(t)}</span>`).join("")}</div>${actions}</div>`;

const sairH=L.sair.length?L.sair.slice(0,15).map((o,i)=>recItem(o,i+1,[[daysIn(o)>=15?"d-bad":daysIn(o)>=7?"d-warn":"d-ok",(daysIn(o)===0?"pronto hoje":plural(daysIn(o),"dia","dias")+" esperando")],[o.status==="pronto"?"p-arr":"p-info",o.status==="pronto"?"pronto":"devolver sem reparo"]],

const rapH=L.rap.length?L.rap.slice(0,8).map((r,i)=>recItem(r.o,i+1,r.why,`${r.o.tempo?"":tempoChips(r.o,"data-nowtmp")}<div class="btnrow">${r.o.status!=="bancada"?`<button type="button" class="btn btn-accent" data-nowgo="${r.o.id}">Começar agora</button>`:""}<button type="button" class="btn btn-line" data-open="${r.o.id}">Abrir OS</button></div>`)).join(""):`<span class="hint">Nada pronto para começar. ${L.travadas?L.travadas+" OS estão esperando peça.":""}</span>`;
const respH=L.resp.filter(o=>daysIn(o)>=3).slice(0,10).map((o,i)=>recItem(o,i+1,[[daysIn(o)>=15?"d-bad":"d-warn",plural(daysIn(o),"dia","dias")+" sem resposta"]],

$("#layer").innerHTML=shell("Liberar a loja",`
<div class="sec"><h4>1. Pode sair hoje <span class="mono">${L.sair.length}</span></h4><span class="hint">Já estão prontos ou para devolver. Avisar o cliente é o jeito mais rápido de abrir espaço.</span>${sairH}</div>
<div class="sec"><h4>2. Consertos rápidos para fazer agora</h4><span class="hint">Têm tudo para começar, ordenados por rapidez e tempo parado na loja.${L.semTempo?` Marque o tempo de ${L.semTempo} OS para a lista ficar mais certa.`:""}</span>${rapH}</div>
${respH?`<div class="sec"><h4>3. Esperando o cliente responder</h4><span class="hint">Orçamento sem resposta ocupa espaço. Com mais de 15 dias, vale devolver.</span>${respH}</div>`:""}`);
}

async function saveStockItem(){
const nome=$("#k_nome").value.trim();if(!nome){$("#k_nome").focus();return}
const ex=estoque.find(i=>norm(i.nome)===norm(nome));
const qv=$("#k_qtd").value,mv=$("#k_min").value,lv=$("#k_loc").value.trim();
const d={nome:ex?ex.nome:nome,qtd:qv!==""?Math.max(0,parseInt(qv,10)||0):(ex?ex.qtd||0:0),minimo:mv!==""?Math.max(0,parseInt(mv,10)||0):(ex?ex.minimo||0:0),local:lv||(ex?ex.local||"":""),atualizadoEm:Date.now()};
const pv=$("#k_preco")?$("#k_preco").value.trim():"";d.preco=pv!==""?parseMoney(pv):(ex?ex.preco||0:0);
try{await scol.doc(ex?ex.id:"i"+uid()).set(d);toast(ex?"Item atualizado":"Item adicionado");["#k_nome","#k_qtd","#k_min","#k_loc","#k_preco"].forEach(s=>{if($(s))$(s).value=""});$("#k_nome").focus()}

async function pullFromStock(){
const o=osList.find(x=>x.id===openId);if(!o)return;
const nome=$("#pullIn").value.trim();const n=Math.max(1,parseInt($("#pullQ").value,10)||1);
if(!nome)return;
const i=estoque.find(x=>norm(x.nome)===norm(nome));
if(!i){toast("Esse item não está no estoque. Cadastre em Estoque.");return}
if((i.qtd||0)<n){toast(`Só tem ${i.qtd||0} no estoque.`);return}

/* SHA-256 em JS puro: dá o mesmo resultado em qualquer celular ou computador */
function sha256(str){
const b=new TextEncoder().encode(str),K=[],H=[];let n=2,c=0;
const ip=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
while(c<64){if(ip(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c++]=(Math.pow(n,1/3)*4294967296)|0}n++}
const l=b.length,words=[];for(let i=0;i<l;i++)words[i>>2]|=b[i]<<(24-(i%4)*8);
words[l>>2]|=0x80<<(24-(l%4)*8);const tot=((l+8)>>6<<4)+16;words[tot-1]=l*8;
for(let i=0;i<tot;i++)words[i]|=0;
const rr=(v,k)=>(v>>>k)|(v<<(32-k));let h=H.slice();
for(let j=0;j<tot;j+=16){const w=words.slice(j,j+16);let [a,bb,cc,d,e,f,g,hh]=h;
for(let i=0;i<64;i++){if(i>=16){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+w[i-7]+(rr(y,17)^rr(y,19)^(y>>>10)))|0}
const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;
hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
h=[a,bb,cc,d,e,f,g,hh].map((v,i)=>(v+h[i])|0)}
return h.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("");
}

function colorFromImage(img){
try{const c=document.createElement("canvas"),W=64,H=64;c.width=W;c.height=H;const x=c.getContext("2d");x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
const B={};for(let i=0;i<d.length;i+=4){const [r,g,b,a]=[d[i],d[i+1],d[i+2],d[i+3]];if(a<128)continue;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?(mx-mn)/mx:0;if(sat<.25||mx<40||mn>235)continue;
let h=0;if(mx===r)h=((g-b)/(mx-mn))%6;else if(mx===g)h=(b-r)/(mx-mn)+2;else h=(r-g)/(mx-mn)+4;const k=Math.round(((h*60+360)%360)/20);
const o=B[k]||(B[k]={w:0,r:0,g:0,b:0});const w=sat;o.w+=w;o.r+=r*w;o.g+=g*w;o.b+=b*w}
const best=Object.values(B).sort((a,b)=>b.w-a.w)[0];if(!best||best.w<20)return null;
let rgb=[best.r/best.w,best.g/best.w,best.b/best.w];const mx=Math.max(...rgb);if(mx>200)rgb=rgb.map(v=>v*0.8);
return "#"+rgb.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("")}catch(_){return null}
}

async function doSignup(){
const nome=$("#c_nome").value.trim(),p1=$("#c_pin").value.trim(),p2=$("#c_pin2").value.trim(),err=$("#c_err");
if(!nome){err.textContent="Coloque seu nome.";return}
if(users.some(u=>norm(u.nome)===norm(nome))){err.textContent="Já existe uma conta com esse nome. Use outro (ex.: nome e sobrenome).";return}
if(!/^\d{4,6}$/.test(p1)){err.textContent="O PIN precisa ter de 4 a 6 números.";return}
if(p1!==p2){err.textContent="Os PINs não são iguais.";return}
const first=!users.length;const id="u"+uid();const u={nome,pinHash:await hashPin(id,p1),admin:first,criadoEm:Date.now()};if(!first&&!isOwnerFlag)u.pendente=true;
try{await ucol.doc(id).set(u);pickedWho=id;loginMode="login";
if(!u.pendente)startSession({id,...u});else{gate();const e2=$("#l_err");if(e2)e2.textContent="Conta criada. Agora o administrador precisa aprovar."}}
catch(_){err.textContent="Não salvou. Verifique a conexão e tente de novo."}
}
async function doReset(){
const u=users.find(x=>x.id===pickedWho),err=$("#r_err");if(!u)return;
const p1=$("#r_pin").value.trim(),p2=$("#r_pin2").value.trim();
if(!isOwnerFlag){const r=$("#r_resp")?.value||"";if(!r.trim()){err.textContent="Responda a pergunta.";return}
if(await hashPin(u.id,"rec:"+norm(r))!==u.recHash){err.textContent="Resposta não confere.";return}}
if(!/^\d{4,6}$/.test(p1)){err.textContent="O PIN precisa ter de 4 a 6 números.";return}
if(p1!==p2){err.textContent="Os PINs não são iguais.";return}
const {id,...d}=u;d.pinHash=await hashPin(id,p1);
try{await ucol.doc(id).set(d);loginMode="login";toast("PIN redefinido");startSession({id,...d})}catch(_){err.textContent="Não salvou. Tente de novo."}

function startSession(u){me=u;sessId=u.id;scope="me";try{localStorage.setItem("bancada.scope","me")}catch(_){}renderScope();try{localStorage.setItem("bancada.sessao",u.id)}catch(_){}gate();renderBoard()}
function selectWs(id,keepSess){
unsubs.forEach(f=>{try{f()}catch(_){}});unsubs=[];
cid=id;try{if(id)localStorage.setItem("bancada.ws",id);else localStorage.removeItem("bancada.ws")}catch(_){}
me=null;if(!keepSess){sessId=null;try{localStorage.removeItem("bancada.sessao")}catch(_){}}
osList=[];users=[];estoque=[];cotList=[];loaded=false;usersLoaded=false;pickedWho=null;
empresa={nome:"",horario:"",logoId:"",logoUrl:""};applyBrand();applySeg();updateStockBadge();
if(!id||!db){gate();return}
const base="ws/"+id;
unsubs.push(db.doc(base).onSnapshot(snap=>{if(cid!==id)return;empresa={nome:"",horario:"",logoId:"",logoUrl:"",...(snap.exists?snap.data():{})};applyBrand();applySeg();if(!me)gate();if(sheetMode==="acct")openAccount()},()=>{}));

ucol=db.collection(base+"/usuarios");
unsubs.push(ucol.onSnapshot(snap=>{if(cid!==id)return;
users=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.criadoEm||0)-(b.criadoEm||0));usersLoaded=true;
if(sessId){me=users.find(u=>u.id===sessId&&!u.pendente)||null;if(!me&&users.length)logout(true)}
gate();renderScope();if(me)renderBoard();if(sheetMode==="acct")openAccount();
},()=>{usersLoaded=true;gate()}));
ccol=db.collection(base+"/cotacoes");
unsubs.push(ccol.onSnapshot(snap=>{if(cid!==id)return;cotList=snap.docs.map(d=>({id:d.id,...d.data()}))},()=>{}));
col=db.collection(base+"/os");
unsubs.push(col.onSnapshot(snap=>{if(cid!==id)return;osList=snap.docs.map(d=>({id:d.id,...d.data()}));loaded=true;renderBoard()},
()=>{loaded=true;notice("A conexão com o quadro caiu. Recarregue a página.");renderBoard()}));
gate();renderBoard();

async function wipeOS(){
const v=norm($("#wipeIn").value),err=$("#wipeErr");
if(v!=="apagar"){err.textContent="Digite APAGAR para confirmar.";return}
const list=osList.filter(o=>resetMode==="all"?true:ownerOf(o)===me.id);
if(!list.length){resetMode=null;openAccount();toast("Não havia OS para apagar");return}
const btn=$("#wipeForm button[type=submit]");btn.disabled=true;
let n=0,fail=0;
for(const o of list){
try{await col.doc(o.id).delete();n++;for(const m of (o.midia||[])){try{if(assets)await assets.delete(m.id)}catch(_){}}}catch(_){fail++}
btn.textContent=`Apagando… ${n}/${list.length}`;
}
resetMode=null;openAccount();
toast(fail?`Apaguei ${n} OS. ${fail} não apagaram, tente de novo.`:`Pronto: ${n} OS apagadas. Quadro zerado.`);
}

const ex=users.find(u=>norm(u.nome)===norm(nome));const id=ex?ex.id:"u"+uid();
const u={...(ex?(({id:_i,...r})=>r)(ex):{}),nome:ex?ex.nome:nome,pinHash:await hashPin(id,pin),admin:ex&&ex.id===me.id?true:adm,criadoEm:ex?ex.criadoEm:Date.now()};
try{await ucol.doc(id).set(u);toast(ex?"PIN trocado":"Usuário criado");$("#u_nome").value="";$("#u_pin").value=""}catch(_){err.textContent="Não salvou. Tente de novo."}
}
/* ---------- Início ---------- */
renderChips();renderBoard();applyBrand();gate();
async function minhasEmpresas(){const {data,error}=await sb.from("membros").select("empresa_id,pendente,admin,nome").eq("user_id",KS.uid);if(error)throw error;return data||[]}
async function carregarAssinatura(){try{const {data}=await sb.rpc("minha_assinatura",{e:KS.eid});KS.assinatura=(data&&data[0])||null}catch(_){KS.assinatura=null}}
(async()=>{
db=await claude.use("db");assets=await claude.use("assets");
const {data:{session}}=await sb.auth.getSession();
if(!session){location.replace("/entrar");return}
KS.uid=session.user.id;KS.email=session.user.email||"";
let ms=[];
try{
ms=await minhasEmpresas();
if(!ms.length){
const md=session.user.user_metadata||{};
if(md.acao==="entrar"&&md.codigo){
const {error}=await sb.rpc("entrar_empresa",{cod:md.codigo,nome_pessoa:md.nome||KS.email.split("@")[0]});
if(error){KS.estado="erro";KS.erroMsg=String(error.message||"").includes("codigo")?"O código da equipe "+md.codigo+" não existe. Confira com o dono da loja.":"Não deu para entrar na equipe.";gate();return}
}else{
const cfg=md.empresa||{nome:"Minha empresa",segmento:"assistencia",atende:{},temSistema:false,marcas:[]};
const {error}=await sb.rpc("criar_empresa",{nome_pessoa:md.nome||KS.email.split("@")[0],cfg});
if(error){KS.estado="erro";KS.erroMsg="Não deu para criar sua empresa agora. Tente de novo em instantes.";gate();return}
}
ms=await minhasEmpresas();
}
}catch(e){KS.estado="erro";KS.erroMsg="Sem conexão com o servidor. Confira a internet e recarregue.";gate();return}
if(!ms.length){KS.estado="erro";gate();return}
const m=ms.find(x=>!x.pendente)||ms[0];
KS.eid=m.empresa_id;
if(m.pendente){const {data}=await sb.from("empresas").select("config").eq("id",KS.eid).maybeSingle();KS.empresaNome=(data&&data.config&&data.config.nome)||"";KS.estado="pendente";gate();return}
await carregarAssinatura();
try{const {data}=await sb.rpc("meus_recursos",{e:KS.eid});KS.recursos=data||{}}catch(_){KS.recursos={}}
try{const {data}=await sb.rpc("sou_admin_konserta");KS.superadmin=!!data}catch(_){KS.superadmin=false}
applyRecursos();
const a=KS.assinatura;
KS.estado=(a&&!a.plano&&Date.parse(a.trial_ate)<Date.now())?"expirado":"ok";
sessId=KS.uid;selectWs(KS.eid,true);
setInterval(async()=>{await carregarAssinatura();const b=KS.assinatura;if(b&&!b.plano&&Date.parse(b.trial_ate)<Date.now()&&KS.estado==="ok"){KS.estado="expirado";gate()}else renderTrial()},30*60*1000);
})();
</script>
